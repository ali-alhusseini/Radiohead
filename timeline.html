<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Historical Timeline Visualizer</title>
<style>
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #161623;
        color: #e0e0e0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        overflow-x: hidden;
    }
    .header-text {
        text-align: center;
        margin-bottom: 60px;
        padding: 0 20px;
    }
    .header-text h2 {
        color: #fff;
        letter-spacing: 1px;
    }
    .container {
        width: 90%;
        max-width: 1200px;
        position: relative;
        padding: 60px 0;
    }
    .timeline-track {
        width: 100%;
        height: 6px;
        background-color: #2c2c3e;
        border-radius: 3px;
        position: relative;
    }
    .timeline-fill {
        height: 100%;
        background-color: #00bcd4;
        width: 0%;
        border-radius: 3px;
        box-shadow: 0 0 10px #00bcd4;
        /* 12 second animation */
        transition: width 12s linear;
    }
    .event {
        position: absolute;
        top: -18px;
        display: flex;
        flex-direction: column;
        align-items: center;
        opacity: 0;
        transform: translateY(15px);
        transition: all 0.6s ease-out;
    }
    .event.visible {
        opacity: 1;
        transform: translateY(0);
    }
    .marker {
        width: 16px;
        height: 16px;
        background-color: #161623;
        border: 4px solid #00bcd4;
        border-radius: 50%;
        z-index: 2;
    }
    .label {
        margin-top: 15px;
        font-weight: 600;
        text-align: center;
        font-size: 1rem;
        white-space: nowrap;
        color: #fff;
    }
    .date {
        font-size: 0.85rem;
        color: #a0a0b0;
        margin-top: 4px;
    }
    .controls {
        margin-top: 40px;
    }
    button {
        padding: 12px 24px;
        font-size: 1.1rem;
        cursor: pointer;
        background-color: #00bcd4;
        color: #161623;
        font-weight: bold;
        border: none;
        border-radius: 8px;
        transition: background-color 0.2s;
    }
    button:hover { 
        background-color: #008ba3; 
    }
</style>
</head>
<body>

<div class="header-text">
    <h2>Charting Human Thought & Society</h2>
    <p>A mathematically proportional timeline from 1000 BCE to Today.</p>
</div>

<div class="container">
    <div class="timeline-track">
        <div class="timeline-fill" id="fill"></div>
        
        <div class="event" style="left: 0%;" data-time="0">
            <div class="marker"></div>
            <div class="label">Early Iron Age</div>
            <div class="date">1000 BCE</div>
        </div>

        <div class="event" style="left: 13.22%;" data-time="1586">
            <div class="marker"></div>
            <div class="label">Median Empire<br>(Peak)</div>
            <div class="date">~600 BCE</div>
        </div>

        <div class="event" style="left: 19.82%;" data-time="2378">
            <div class="marker"></div>
            <div class="label">Socrates<br>(Classical Philosophy)</div>
            <div class="date">~400 BCE</div>
        </div>

        <div class="event" style="left: 33.04%;" data-time="3964">
            <div class="marker" style="border-color: #ffb300;"></div>
            <div class="label" style="color: #ffb300;">The BCE / CE Divide</div>
            <div class="date">Year 1</div>
        </div>

        <div class="event" style="left: 36.35%;" data-time="4362">
            <div class="marker"></div>
            <div class="label">Epictetus<br>(Stoicism)</div>
            <div class="date">~100 CE</div>
        </div>

        <div class="event" style="left: 100%;" data-time="12000">
            <div class="marker"></div>
            <div class="label">Present Day</div>
            <div class="date">2026 CE</div>
        </div>
    </div>
</div>

<div class="controls">
    <button onclick="startAnimation()">Run Timeline</button>
</div>

<script>
    function startAnimation() {
        const fill = document.getElementById('fill');
        const events = document.querySelectorAll('.event');
        
        // Reset the animation
        fill.style.transition = 'none';
        fill.style.width = '0%';
        events.forEach(e => e.classList.remove('visible'));
        
        // Trigger the animation shortly after reset
        setTimeout(() => {
            fill.style.transition = 'width 12s linear';
            fill.style.width = '100%';
            
            // Pop in the events as the line reaches them
            events.forEach(event => {
                const delay = parseInt(event.getAttribute('data-time'));
                setTimeout(() => {
                    event.classList.add('visible');
                }, delay);
            });
        }, 100);
    }
</script>
</body>
</html>
